<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civ Terminal | Jeremy Dowdy</title>
    <meta name="description" content="Civ Terminal: a civilization sim played in a terminal. Name a civilization, guide it from the Stone Age, and face dilemmas where every option has a real cost. Runs entirely in your browser.">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pre theme-green">
    <a class="back" href="../">&larr; back to site</a>

    <canvas id="map" role="img" aria-label="World map. Type &quot;map&quot; in the terminal for a text description."></canvas>

    <main id="term">
        <h1 class="sr-only">Civ Terminal</h1>
        <div id="out" role="log" aria-live="polite" aria-label="Terminal output" tabindex="0"></div>
        <div id="line"><span id="ps1" aria-hidden="true">&gt; </span><span id="mirror" aria-hidden="true"></span><input id="in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="80" aria-label="Terminal input" disabled></div>
    </main>

    <noscript><p class="noscript">Civ Terminal needs JavaScript to run.</p></noscript>
    <script type="module" src="main.js"></script>
</body>
</html>
